# HexLinux — load the uinput driver at boot, for the virtual keyboard.
#
# Installed by `install-udev-rules.sh --with-uinput` as
# /etc/modules-load.d/hexlinux.conf. Ubuntu 24.04 builds uinput into its
# kernel, where this line changes nothing; a kernel that ships it as a module
# (recent WSL kernels do) loads it only when asked.
uinput
